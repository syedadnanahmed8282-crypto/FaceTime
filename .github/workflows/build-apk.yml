name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4


      # 2. Setup JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"


      # 3. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3


      # 4. Verify Firebase Configuration
      - name: Verify Firebase Configuration
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "ERROR: app/google-services.json not found."
            exit 1
          fi

          echo "google-services.json found."


      # 5. Restore Custom Keystore
      - name: Restore Custom Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | tr -d '\r\n ' \
            | base64 --decode > app/facetime-upload.keystore

          if [ ! -s "app/facetime-upload.keystore" ]; then
            echo "ERROR: Keystore restoration failed."
            exit 1
          fi

          echo "Custom keystore restored successfully."


      # 6. Verify Custom Keystore and SHA-1
      - name: Verify Custom Keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "Verifying custom keystore..."

          keytool -list -v \
            -keystore app/facetime-upload.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            | grep -E "Alias name:|SHA1:|SHA256:"


      # 7. Run Signing Report
      - name: Run Signing Report
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:signingReport


      # 8. Build Debug APK
      - name: Build Debug APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleDebug --stacktrace


      # 9. Verify APK
      - name: Verify APK
        run: |
          if ! ls app/build/outputs/apk/debug/*.apk 1> /dev/null 2>&1; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh app/build/outputs/apk/debug/*.apk


      # 10. Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaceTime-Debug
          path: app/build/outputs/apk/debug/*.apk
