name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_CONTENT" ]; then
            echo "$GOOGLE_SERVICES_CONTENT" > app/google-services.json
          fi

      - name: Restore Custom Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > facetime-upload.keystore
            cp facetime-upload.keystore app/facetime-upload.keystore
          elif [ -f "facetime-keystore-base64.txt" ]; then
            cat facetime-keystore-base64.txt | base64 --decode > facetime-upload.keystore
            cp facetime-upload.keystore app/facetime-upload.keystore
          fi

      - name: Run Signing Report
        run: gradle :app:signingReport

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyCallApp-Debug
          path: app/build/outputs/apk/debug/*.apk
